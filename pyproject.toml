[project]
name = "ags-rdf"
version = "0.1.0"
description = "Generate SHACL shapes, an OWL data model and SKOS/VocExcel vocabularies (TTL, N-Triples, XLSX) from the AGS4 data dictionary JSON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "KoalaGeo" }]
dependencies = [
    "rdflib>=7.1",
    "pyshacl>=0.30",
    "vocexcel>=1.0.4",
    "kurra>=3.0",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
# PDF cross-check of the JSON against the published AGS dictionary PDF
check = ["pdfplumber>=0.11"]
# Validate the generated Prez/KGM manifest with Kurrawong's kgm tool
kgm = ["kgm>=2.1"]
dev = ["pytest>=8", "pdfplumber>=0.11"]

[project.scripts]
ags-rdf = "ags_rdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ags_rdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Code. _mock_name is not defined:UserWarning"]
markers = [
    "network: test needs access to gitlab.com",
    "source: test needs the full AGS4 source snapshot (set AGS_RDF_SOURCE or have network access)",
]
