name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly rebuild from the AGS GitLab repository

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra kgm
      - run: uv run pytest

  build:
    # Scrape the AGS4 JSON from GitLab, build every release and keep the outputs as an artifact
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra check
      - run: uv run ags-rdf build --source gitlab --release all --out dist
      - run: uv run ags-rdf check-pdf --source gitlab --out dist/checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ags-rdf-dist
          path: dist/
